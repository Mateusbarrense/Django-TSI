<table>
    <tbody style="font-size: 20px; text-align: center; font-family: Arial, Helvetica, sans-serif;">
        {% for funcionario in funcionarios %}
        <tr>
            <td><strong>{{ funcionario.nome }}</strong></td>
            <td>{{ funcionario.sobrenome }}</td>
            <td>{{ funcionario.remuneracao }}</td>
            <td>{{ funcionario.tempo_de_servico }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
